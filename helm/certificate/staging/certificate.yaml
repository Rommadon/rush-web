apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shopdit-web-certificate
  namespace: staging
spec:
  secretName: shopdit-web-certificate
  issuerRef:
    name: shopdit-web-issuer
    kind: Issuer
    group: cert-manager.io
  commonName: "*.staging.myshopdit.com"
  dnsNames:
    - "staging.myshopdit.com"
    - "*.staging.myshopdit.com"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shopdit-web-http01-certificate
  namespace: staging
spec:
  secretName: shopdit-web-http01-certificate
  issuerRef:
    name: shopdit-web-http01-issuer
    kind: Issuer
    group: cert-manager.io
  dnsNames:
    - "www.shopdit.world"
    - "shopdit.world"